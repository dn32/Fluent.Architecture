name: .NET Core

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Setup .NET Core 3.0
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 3.0.100
    - name: Setup .Net Core 2.2
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 2.1.202
    - name: Build with dotnet netcoreapp2.2
      run: dotnet build Fluent.Architecture.sln --configuration Release --framework netcoreapp2.2
    - name: Build with dotnet netcoreapp3.0
      run: dotnet build Fluent.Architecture.sln --configuration Release --framework netcoreapp3.0
    
      
